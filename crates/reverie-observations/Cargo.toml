[package]
name = "reverie-observations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reverie-resource-history"
path = "src/bin/reverie-resource-history.rs"

[[bin]]
name = "reverie-prune-receipts"
path = "src/bin/reverie-prune-receipts.rs"

[[bin]]
name = "reverie-prune-report-export"
path = "src/bin/reverie-prune-report-export/main.rs"

[[bin]]
name = "reverie-collect"
path = "src/bin/reverie-collect.rs"

[[bin]]
name = "reverie-observations"
path = "src/bin/reverie-observations.rs"

[[bin]]
name = "reverie-collect-state"
path = "src/bin/reverie-collect-state.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
getrandom.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "poll", "resource", "signal", "user"] }
reverie-contracts.workspace = true
reverie-core.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
