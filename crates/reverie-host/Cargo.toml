[package]
name = "reverie-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
getrandom.workspace = true
# "signal" is for the lease CLI, which shares one Nix build with the other host tools: with it here every
# host tool resolves the same nix features alone as together. The other host tools now also compile nix's
# signal and process modules.
nix = { workspace = true, features = ["term", "fs", "socket", "poll", "user", "signal", "time"] }
reverie-core.workspace = true
reverie-worker-client.workspace = true
reverie-diagnostics.workspace = true
reverie-python-regex.workspace = true
reverie-contracts.workspace = true
reverie-store.workspace = true
reverie-http.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
base64.workspace = true
unicode-normalization.workspace = true
idna.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["mount"] }
socket2.workspace = true
sha2.workspace = true

[lints]
workspace = true
