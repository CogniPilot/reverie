[package]
name = "rustpython-wtf8"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
unicode-trim = ["bstr/unicode"]

[dependencies]
ascii = { version = "1.1", default-features = false, features = ["alloc"] }
bstr = { version = "1", default-features = false, features = ["alloc"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
memchr = { version = "2.8.1", default-features = false, features = ["alloc"] }
