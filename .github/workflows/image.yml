name: image

# Every pull request and every push to main builds the image, checks its contents and boots it once;
# nothing is published.
# A published GitHub release builds its tagged commit the same way, pushes it to
# ghcr.io/<owner>/reverie as X.Y.Z, X.Y and latest, and attaches the Debian-tested offline bundle and setup.sh to the release.
# The release notes must name the reviewed commit on a line "Reviewed commit: <40-hex sha>";
# a release whose tag points elsewhere is refused.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # A newer PR commit supersedes its previous image build. Keep main and
  # release builds running so accepted artifacts are still produced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free unused hosted-runner toolchains
        run: |
          # This dedicated job builds with Nix; the preinstalled mobile, .NET
          # and Haskell SDKs consume space needed for image layers and scans.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          df -h /

      - name: Match the release to the reviewed commit
        if: github.event_name == 'release'
        env:
          BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag $TAG is not vX.Y.Z"; exit 1
          fi
          reviewed=$(printf '%s\n' "$BODY" | sed -n 's/^Reviewed commit: \([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' | head -n 1)
          actual=$(git rev-parse HEAD)
          echo "tag $TAG is $actual; release notes name ${reviewed:-nothing}"
          test -n "$reviewed" && test "$reviewed" = "$actual"

      # The action's max-jobs = auto lets Nix build four derivations at once on this four-core runner, beside the
      # timing-sensitive console tests. This limits local Nix builds to two at once and asks builders for two-way
      # parallelism; cores only sets NIX_BUILD_CORES and does not bound test or child processes. It may reduce
      # contention; its effect on total CPU use and test timing is unmeasured.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2

      - name: Restore and save the Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # PR caches are scoped to their merge ref and cannot warm main.
          # Keep the shared main cache from competing with multi-GB PR copies.
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 8G
          primary-key: nix-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}-
            nix-image-${{ runner.os }}-${{ runner.arch }}-
            nix-voice-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}-

      - name: Report the restored Nix cache
        env:
          RESTORED_KEY: ${{ steps.nix-cache.outputs.restored-key }}
        run: |
          printf 'Nix cache restored: %s\n' "${RESTORED_KEY:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check and build the flake on vanilla Ubuntu
        run: |
          mkdir -p "$HOME/scratch/reverie/build" "$HOME/scratch/reverie/tmp"
          export TMPDIR="$HOME/scratch/reverie/tmp"
          nix flake check --print-build-logs
          nix develop --command node --test tests/*.mjs
          nix build .#default --out-link "$HOME/scratch/reverie/build/app"
          "$HOME/scratch/reverie/build/app/bin/reverie" --version
          nix build .#memory --out-link "$HOME/scratch/reverie/build/memory"
          "$HOME/scratch/reverie/build/memory/bin/python3" -I -c 'import reverie, experts; from reverie.memory import MemoryStore; MemoryStore(":memory:").close()'
          nix build .#dockerImage --out-link "$HOME/scratch/reverie/build/docker-image"
          docker load --input "$HOME/scratch/reverie/build/docker-image"
          docker tag reverie:latest "reverie:$GITHUB_SHA"
          docker image inspect --format '{{.Id}}' "reverie:$GITHUB_SHA" | tee image-id.txt
          # The loaded image and offline artifact own the transport archive now.
          # Retain the checked app and memory roots; let pre-save GC discard
          # old outputs and the multi-GB image tar instead of caching it twice.
          rm "$HOME/scratch/reverie/build/docker-image"

      - name: Start the native application with an empty instance
        run: |
          app="$HOME/scratch/reverie/build/app/bin/reverie"
          native_home=$(mktemp -d "$HOME/scratch/reverie/tmp/native-home.XXXXXX")
          HOME="$native_home" REVERIE_DATA_DIR="$native_home/data" REVERIE_PASSWORD=ci-local-password REVERIE_INSTALL_CLIS=none \
            "$app" web --host 127.0.0.1 --port 3100 > "$native_home/console.log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true; wait "$native_pid" 2>/dev/null || true' EXIT
          code=000
          for _ in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/status || true)
            [ "$code" = 401 ] && break
            kill -0 "$native_pid" || { cat "$native_home/console.log"; exit 1; }
            sleep 1
          done
          [ "$code" = 401 ] || { cat "$native_home/console.log"; exit 1; }

      - name: Qualify real perf in the Nix worker image under task-v1 seccomp
        env:
          REVERIE_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-perf-target
        run: nix develop --command cargo xtask verify-worker-perf --ci

      - name: Smoke-test the pinned Codex runtime against generated launch commands
        timeout-minutes: 6
        run: |
          # Install only in this disposable container; published image layers stay unchanged.
          trap 'docker rm --force codex-runtime-ci 2>/dev/null || true' EXIT
          docker run --detach --name codex-runtime-ci --entrypoint sleep "reverie:$GITHUB_SHA" infinity
          docker exec --env REVERIE_INSTALL_CLIS=codex codex-runtime-ci timeout --kill-after=5s 240s reverie-install-clis
          # Parsing/startup must work without credentials or any possibility of a model request.
          docker network disconnect bridge codex-runtime-ci
          docker exec -i codex-runtime-ci node --input-type=module < .github/ci/codex-runtime-smoke.mjs

      - name: Check the image contents
        run: |
          image_archive="$HOME/scratch/reverie/build/image.tar"
          unpacked=$(docker image inspect --format '{{.Size}}' "reverie:$GITHUB_SHA")
          echo "image size: $((unpacked / 1000000)) MB unpacked" | tee -a "$GITHUB_STEP_SUMMARY"
          # Save both offline install tags, then scan the exact archive that will ship.
          version=0.0.0-ci
          if [ "${{ github.event_name }}" = release ]; then version="${{ github.event.release.tag_name }}"; version=${version#v}; fi
          image=$(bash scripts/setup.sh --print-image-repository "$GITHUB_REPOSITORY_OWNER")
          docker tag "reverie:$GITHUB_SHA" "$image:$version"
          docker tag "reverie:$GITHUB_SHA" "$image:latest"
          docker save "$image:latest" "$image:$version" --output "$image_archive"
          "$HOME/scratch/reverie/build/memory/bin/python3" -I -m reverie.image_check "$image_archive" --allow docker/image-check-allow.tsv --json image-check.json
          mkdir -p offline-bundle
          mv "$image_archive" offline-bundle/reverie-image.tar
          cp scripts/setup.sh offline-bundle/setup.sh
          cp docs/INSTALL.md offline-bundle/INSTALL.md
          bash scripts/release-image.sh metadata "$GITHUB_REPOSITORY_OWNER" "$version" "$GITHUB_SHA" "$(cat image-id.txt)" > offline-bundle/IMAGE-REF.txt
          (cd offline-bundle && sha256sum reverie-image.tar setup.sh INSTALL.md IMAGE-REF.txt > SHA256SUMS)
          tar -C offline-bundle -czf "reverie-$version.tar.gz" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-bundle
          path: reverie-*.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Boot an empty instance and preserve it across recreation
        run: |
          # The image's own start script and default command, as a user would run it.
          trap 'docker rm --force boot 2>/dev/null || true; docker volume rm reverie-ci-instance reverie-ci-home 2>/dev/null || true' EXIT
          docker run --detach --restart unless-stopped --name boot --network none --env REVERIE_INSTALL_CLIS=none --volume reverie-ci-instance:/instances --volume reverie-ci-home:/home/agent "reverie:$GITHUB_SHA"
          status() { docker exec boot curl -sS -o /dev/null -w '%{http_code}' "$@" http://127.0.0.1:3000/api/status || true; }
          for _ in $(seq 1 60); do
            code=$(status)
            if [ "$code" != 000 ] && [ -n "$code" ]; then break; fi
            sleep 2
          done
          echo "without the owner password: ${code:-none}"
          [ "$code" = 401 ] && ok=1
          # Under enforce, the console (Basic) password alone must NOT reach an owner route:
          # the signed-in owner session is required. Present it through a netrc file (so it never
          # appears in a command line) and require a 401. The full owner sign-in 200 path is covered
          # by the owner-auth-fresh-enforce unit test and the image acceptance checks.
          docker exec boot bash -c 'umask 077; printf "machine 127.0.0.1 login owner password %s\n" \
            "$(cat /instances/default/owner-password)" > "$TMPDIR/netrc"' || ok=
          code=$(status --netrc-file /scratch/tmp/netrc)
          echo "with the console password alone (must be refused under enforce): $code"
          [ "$code" = 401 ] || ok=
          # Full built-image owner-login acceptance: bootstrap, one-time sign-in, password
          # change, owner route 200, and the refusals. The one-time password stays in 0600 files.
          docker exec -i boot bash -s < .github/ci/boot-owner.sh || ok=
          test "$(docker exec boot stat -c %a /instances/default/owner-password)" = 600 || ok=
          docker exec boot env REVERIE_INSTALL_CLIS=none reverie-install-clis || ok=
          docker exec boot /opt/reverie/python/bin/python3 -I -c 'import reverie, experts' || ok=
          docker inspect --format 'state {{.State.Status}}, exit code {{.State.ExitCode}}' boot
          docker logs boot 2>&1 | tail -n 40
          docker exec boot bash -c 'mkdir -p "$HOME/.config/reverie-ci"; printf preserved > "$HOME/.config/reverie-ci/home-marker"'
          before=$(docker exec boot sha256sum /instances/default/owner-password /instances/default/console/owner-auth.json /instances/default/console/owner-auth.policy /home/agent/.config/reverie-ci/home-marker)
          docker rm --force boot
          docker run --detach --restart unless-stopped --name boot --network none --env REVERIE_INSTALL_CLIS=none --volume reverie-ci-instance:/instances --volume reverie-ci-home:/home/agent "reverie:$GITHUB_SHA"
          code=000
          for _ in $(seq 1 60); do
            code=$(status)
            [ "$code" = 401 ] && break
            sleep 1
          done
          [ "$code" = 401 ] || ok=
          after=$(docker exec boot sha256sum /instances/default/owner-password /instances/default/console/owner-auth.json /instances/default/console/owner-auth.policy /home/agent/.config/reverie-ci/home-marker)
          [ "$before" = "$after" ] || ok=
          # Let Docker consider startup successful before testing its restart policy.
          sleep 10
          restart_before=$(docker inspect --format '{{.RestartCount}}' boot)
          pid=$(docker inspect --format '{{.State.Pid}}' boot)
          test "$(docker inspect --format '{{.Name}} {{.State.Running}}' boot)" = '/boot true'
          [[ "$pid" =~ ^[0-9]+$ ]] || exit 1
          [ "$pid" -gt 1 ] || exit 1
          # docker kill marks the container manually stopped and suppresses this policy.
          # Kill only this fresh test container's inspected host PID1 as an unexpected crash.
          sudo kill -KILL -- "$pid"
          restarted=0
          for _ in $(seq 1 60); do
            restart_after=$(docker inspect --format '{{.RestartCount}}' boot)
            running=$(docker inspect --format '{{.State.Running}}' boot)
            if [ "$restart_after" -gt "$restart_before" ] && [ "$running" = true ]; then restarted=1; break; fi
            sleep 1
          done
          [ "$restarted" = 1 ] || { docker logs boot; exit 1; }
          # Readiness is checked only after a confirmed new process starts.
          code=000
          for _ in $(seq 1 60); do
            code=$(status)
            [ "$code" = 401 ] && break
            sleep 1
          done
          [ "$code" = 401 ] || ok=
          recovered=$(docker exec boot sha256sum /instances/default/owner-password /instances/default/console/owner-auth.json /instances/default/console/owner-auth.policy /home/agent/.config/reverie-ci/home-marker)
          [ "$before" = "$recovered" ] || ok=
          docker stop --time 5 boot
          stopped_restarts=$(docker inspect --format '{{.RestartCount}}' boot)
          sleep 2
          test "$(docker inspect --format '{{.State.Running}}' boot)" = false
          test "$(docker inspect --format '{{.RestartCount}}' boot)" = "$stopped_restarts"
          test "${ok:-}" = 1


  worker-browser:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-bundle
          path: bundle
      - name: Prepare disposable runner storage and browser namespaces
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /scratch/tmp
          sudo chown "$(id -u):$(id -g)" /scratch /scratch/tmp
          # Only this ephemeral runner VM; Chromium retains its own sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          df -h / /scratch
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Load and identify the tested image
        run: |
          set -euo pipefail
          mkdir bundle/extracted
          tar -xzf bundle/reverie-*.tar.gz -C bundle/extracted
          (cd bundle/extracted && sha256sum --check SHA256SUMS)
          version=$(sed -n 's/^Version: //p' bundle/extracted/IMAGE-REF.txt)
          image=$(bash scripts/release-image.sh load docker bundle/extracted "$GITHUB_REPOSITORY_OWNER" "$version" "$(git rev-parse HEAD)")
          rm -rf bundle
          printf '%s\n' "$image" > "$RUNNER_TEMP/tested-image-id"
      - name: Exercise real isolated workers using the tested image
        run: |
          set -euo pipefail
          mkdir -p acceptance
          nix develop --command python3 -m reverie.buildenv \
            --project integration-workers --repo "$PWD" --expect 2G --disk 1G --jobs 1 \
            -- python3 .github/ci/worker-isolation-smoke.py --image "$(cat "$RUNNER_TEMP/tested-image-id")" \
            2>&1 | tee acceptance/worker-smoke.log
      - name: Qualify the actual packaged native viewer without restarting a provider
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-viewer-target
        run: |
          set -euo pipefail
          nix build .#nativeWorkerViewerImage --out-link "$RUNNER_TEMP/native-viewer-image" --print-build-logs
          docker load --input "$RUNNER_TEMP/native-viewer-image"
          viewer_image=$(docker image inspect --format '{{.Id}}' reverie-worker-viewer:native-v1)
          # The test rejects mutable tags and verifies both loaded image IDs.
          # All workers, mounts and engine mutations belong to its fresh fixture.
          nix develop --command env \
            REVERIE_VIEWER_DOCKER_FIXTURE=1 \
            REVERIE_VIEWER_TEST_WORKER_IMAGE="$(cat "$RUNNER_TEMP/tested-image-id")" \
            REVERIE_VIEWER_TEST_SERVICE_IMAGE="$viewer_image" \
            cargo test -p reverie-host worker_viewer::tests::docker \
              -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee acceptance/native-viewer.log
      - name: Build the sandboxed browser and exercise synthetic office controls
        run: |
          set -euo pipefail
          nix build .#browserRuntime --out-link "$RUNNER_TEMP/browser-runtime" --print-build-logs
          nix develop --command npm ci --prefix apps/web --ignore-scripts
          nix develop --command node apps/web/scripts/fix-node-pty.mjs
          nix develop --command node apps/web/scripts/prepare-test-vendor.mjs
          export REVERIE_BROWSER_EXECUTABLE="$RUNNER_TEMP/browser-runtime/bin/chromium"
          export REVERIE_BROWSER_ARTIFACTS="$PWD/acceptance/browser"
          df -h /
          nix develop --command python3 -m reverie.buildenv \
            --project integration-browser --repo "$PWD" --expect 2G --disk 1G --jobs 1 \
            -- bash -euo pipefail -c 'node .github/ci/company-office-browser.mjs; node .github/ci/laptop-power-browser.mjs' \
            2>&1 | tee acceptance/browser.log
          # Render the real management UI at desktop and narrow phone widths.
          # Every response comes from synthetic fixtures on an ephemeral port.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$REVERIE_BROWSER_EXECUTABLE" \
            TEST_RESOURCE_SCREENSHOT_DIR="$REVERIE_BROWSER_ARTIFACTS/resources" \
            TEST_OFFICE_SCREENSHOT_DIR="$REVERIE_BROWSER_ARTIFACTS/office" \
            nix develop --command node apps/web/node_modules/vitest/vitest.mjs run \
              --config apps/web/config/vitest.browser.config.ts \
              apps/web/test/company-resource-layout.browser.test.ts \
              apps/web/test/office-server.browser.test.ts \
            2>&1 | tee acceptance/resource-layout.log
          printf 'Worker and browser acceptance completed for %s\n' "$(cat "$RUNNER_TEMP/tested-image-id")" > acceptance/PASS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-browser-acceptance
          path: acceptance/
          if-no-files-found: error

  debian-install:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-bundle
          path: bundle
      - name: Free runner space and prepare Debian Docker storage
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          sudo mkdir -p /mnt/debian-docker
          df -h / /mnt/debian-docker
      - name: Install the bundle on Debian 12 with its own Docker daemon
        run: |
          docker run --rm --privileged \
            --volume /mnt/debian-docker:/var/lib/docker \
            --volume "$PWD/bundle:/input:ro" \
            --volume "$PWD/.github/ci:/ci:ro" \
            debian:12 bash /ci/debian-install.sh

  publish-image:
    needs: [image, debian-install, worker-browser]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free runner space for the tested image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          df -h /
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-bundle
          path: bundle
      - name: Load the Debian-tested image without rebuilding
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          mkdir tested-image
          tar -xzf "bundle/reverie-$version.tar.gz" -C tested-image
          (cd tested-image && sha256sum -c SHA256SUMS)
          actual=$(bash scripts/release-image.sh load docker tested-image "$GITHUB_REPOSITORY_OWNER" "$version" "$GITHUB_SHA")
          docker tag "$actual" "reverie:$GITHUB_SHA"
      - name: Publish the release
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE=$(bash scripts/setup.sh --print-image-repository "$GITHUB_REPOSITORY_OWNER")
          version=${TAG#v}
          line=${version%.*}
          tags=$version
          # A patch on an older line must not move that line's newest tag or latest backward.
          newest_in_line=$(git tag --list "v$line.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          newest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          test "$newest_in_line" = "$TAG" && tags="$tags $line"
          test "$newest" = "$TAG" && tags="$tags latest"
          echo "publishing: $tags"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for tag in $tags; do
            docker tag "reverie:$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
          [[ "$digest" =~ ^"$IMAGE"@sha256:[0-9a-f]{64}$ ]]
          docker pull "$digest"
          test "$(docker image inspect --format '{{.Id}}' "$digest")" = \
            "$(docker image inspect --format '{{.Id}}' "reverie:$GITHUB_SHA")"
          printf 'Image publication verified: %s\n' "$digest" | tee -a "$GITHUB_STEP_SUMMARY"

  release-assets:
    needs: [image, debian-install, worker-browser]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-bundle
          path: bundle
      - name: Attach the Debian-tested offline bundle and setup script
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Asset attachment and GHCR publication are independent outcomes.
        run: |
          bundle="reverie-${TAG#v}.tar.gz"
          assets=("bundle/$bundle")
          # GitHub refuses a release asset of 2 GiB or more (0.3.0's bundle was 2.74 GB), so a large bundle is attached as
          # numbered parts under that limit plus the whole archive's checksum; INSTALL.md says how to join them.
          if [ "$(stat -c %s "bundle/$bundle")" -ge 2000000000 ]; then
            (cd bundle && split --bytes=1900M --numeric-suffixes --suffix-length=2 "$bundle" "$bundle.part-" && sha256sum "$bundle" > "$bundle.sha256")
            assets=(bundle/"$bundle".part-* "bundle/$bundle.sha256")
          fi
          gh release upload "$TAG" "${assets[@]}" scripts/setup.sh --clobber --repo "$GITHUB_REPOSITORY"
          printf 'Release assets attached for %s; see publish-image separately for GHCR status.\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
