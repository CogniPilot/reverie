name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # Ordered gates: Rust/policies 15m + real cgroup 5m + selected package 15m,
    # with 5m for checkout, Nix setup, boundary checks and namespace preparation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Enforce retired host-launch boundaries without building images
        run: |
          nix eval --raw .#checks.x86_64-linux.boxedRuntimeBoundary.drvPath
          nix eval --raw .#checks.aarch64-linux.boxedRuntimeBoundary.drvPath
      - name: Prepare exact owned user-namespace test prerequisite
        env:
          REVERIE_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-rust-target
          TMPDIR: ${{ runner.temp }}
        run: nix develop --command cargo xtask prepare-ci-userns
      - name: Verify Rust and repository policies through cargo xtask
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-rust-target
          TMPDIR: ${{ runner.temp }}
        run: nix develop --command cargo xtask verify
      - name: Qualify real cgroup2 writer observation outside the Nix build sandbox
        timeout-minutes: 5
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-rust-target
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          nix develop --command cargo test --locked -p reverie-deployment --lib -- --ignored service::apply::live_accounts::tests::cgroup_observer | tee "$RUNNER_TEMP/reverie-cgroup2-observer-tests.log"
          grep -F 'test result: ok. 3 passed; 0 failed;' "$RUNNER_TEMP/reverie-cgroup2-observer-tests.log"
      - name: Qualify selected native worker executable and manifest
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-rust-target
          TMPDIR: ${{ runner.temp }}
        run: nix develop --command cargo xtask verify-worker-package

  portable:
    name: Portable Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Verify portable contracts and tooling
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/reverie-rust-portable
        run: cargo xtask verify-portable
