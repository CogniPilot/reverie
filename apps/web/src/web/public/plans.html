<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plans</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --panel2:#f9f8f5; --line:#e2dfd6; --grid:#ece9e1;
  --fg:#1d1f24; --muted:#6b6e76; --faint:#9a9ca3; --accent:#2f5bd3; --accent-soft:#e3eafb;
  --good:#2f8f5b; --warn:#b77d0b; --bad:#c23b2e;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 16px rgba(20,20,30,.04);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#161920; --panel2:#1b1f27; --line:#2a2f3a; --grid:#20242d;
  --fg:#e7e9ee; --muted:#9aa0ad; --faint:#666c79; --accent:#7fa2ff; --accent-soft:#1e2a47;
  --good:#4fbf86; --warn:#e3a531; --bad:#ef6a5a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#161920; --panel2:#1b1f27; --line:#2a2f3a; --grid:#20242d;
  --fg:#e7e9ee; --muted:#9aa0ad; --faint:#666c79; --accent:#7fa2ff; --accent-soft:#1e2a47;
  --good:#4fbf86; --warn:#e3a531; --bad:#ef6a5a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;padding:6px 12px;min-height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.link{font:inherit;font-size:12.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;min-height:32px;text-align:left}
.note{color:var(--muted);font-size:12.5px;margin:0}
.err{color:var(--bad);font-size:13px;margin:0}
.legend{color:var(--muted);font-size:12.5px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.prov{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.label{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--grid);color:var(--muted)}
.rec{margin-left:auto;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.rec.push,.rec.steady{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.rec.ease{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.rec.stop,.rec.login{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.rec.unknown{background:var(--grid);color:var(--muted)}
.bar-row{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.time i{background:var(--faint)}
.bar.push i,.bar.steady i{background:var(--good)} .bar.ease i{background:var(--warn)} .bar.stop i{background:var(--bad)}
.bar-row b{font:600 12px var(--mono);color:var(--fg);text-align:right}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px}
.facts div{font-size:11.5px;color:var(--muted)} .facts b{display:block;font:600 13.5px var(--mono);color:var(--fg)}
.sessions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sessions span.k{font-size:11.5px;color:var(--muted)}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);padding:16px;width:min(94vw,440px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 10px;font-size:16px}
form,.step{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
input,select{font:inherit;font-size:16px;padding:8px 10px;min-height:40px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.code{font:600 20px var(--mono);letter-spacing:.08em;padding:6px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.status{font-size:13px;margin:0 0 10px} .status.failed,.status.timeout{color:var(--bad)} .status.signed_in{color:var(--good)}
.qr svg{width:160px;height:160px;background:#fff;padding:6px;border-radius:6px}
@media (max-width:520px){.btn{min-height:44px}.link{min-height:44px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Plans</h1>
      <div class="meta"><span id="updated">loading…</span></div>
    </div>
    <div class="row">
      <button class="btn primary" id="addBtn" type="button">Add account</button>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
  </header>
  <p class="legend">Per account: the grey bar is how far through its week it is, the coloured bar how much it has used. Pace is used minus elapsed: negative means headroom.</p>
  <p class="err" id="error" hidden></p>
  <div class="grid" id="grid"></div>
</div>
<dialog id="addDlg" aria-label="Add subscription account"></dialog>
<dialog id="signDlg" aria-label="Sign in"></dialog>
<dialog id="removeDlg" aria-label="Remove account"></dialog>
<script src="display-time.js"></script>
<script>
(function () {
  'use strict';
  var REC = {
    push: ['Push', 'Well behind an even burn: give its agents more work'],
    steady: ['On pace', 'On pace'],
    ease: ['Ease off', 'Ahead of an even burn: move work elsewhere'],
    stop: ['Runs out', '5-hour window nearly full or the week used up'],
    login: ['Sign in', 'Not logged in'],
    unknown: ['No data', 'The provider gave no usage reading']
  };
  var SETTLED = ['signed_in', 'failed', 'timeout', 'cancelled'];
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function btn(text, cls, fn) {
    var b = el('button', cls, text);
    b.type = 'button';
    if (fn) b.onclick = fn;
    return b;
  }
  async function api(path, opts) {
    opts = opts || {};
    try {
      var res = await fetch(path, {
        method: opts.method || 'GET',
        headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        cache: 'no-store'
      });
      var json = await res.json().catch(function () { return null; });
      if (!res.ok || !json || json.success === false) {
        return { ok: false, error: (json && (json.error || json.message)) || ('HTTP ' + res.status) };
      }
      return { ok: true, data: json.data };
    } catch (e) {
      return { ok: false, error: 'Network error' };
    }
  }
  var et = function (ms) {
    return ms ? (window.ReverieTime?.format(ms) ?? new Date(ms).toLocaleString('en-US', { timeZone: 'UTC', timeZoneName: 'short' })) : '-';
  };
  var pct = function (n) { return n === null || n === undefined ? '-' : Math.round(n) + '%'; };
  var providerName = function (p) { return p === 'anthropic' ? 'Claude' : 'Codex'; };

  function bar(label, value, cls, title) {
    var row = el('div', 'bar-row');
    row.title = title || '';
    var track = el('div', 'bar ' + cls);
    var fill = el('i');
    fill.style.width = Math.max(0, Math.min(100, value || 0)) + '%';
    track.append(fill);
    row.append(el('span', '', label), track, el('b', '', pct(value)));
    return row;
  }
  function fact(k, v) {
    var d = el('div');
    d.append(el('b', '', v), document.createTextNode(k));
    return d;
  }

  function card(a) {
    var p = a.pace || {};
    var rec = REC[p.recommendation] || REC.unknown;
    var c = el('article', 'card');
    var top = el('div', 'top');
    top.append(el('span', 'prov', providerName(a.provider)), el('span', 'label', a.label));
    if (a.isDefault) top.append(el('span', 'tag', 'default'));
    if (a.orchestrator) top.append(el('span', 'tag', 'orchestrator'));
    var chip = el('span', 'rec ' + (p.recommendation || 'unknown'), rec[0]);
    chip.title = rec[1];
    top.append(chip);
    c.append(top);
    var signIn = function (text, cls) {
      return btn(text, cls, function () { startSignIn(a.id, providerName(a.provider) + ' · ' + a.label); });
    };
    var removable = function () {
      if (!a.profileId) return null;
      return btn('Remove account', 'link', function () { confirmRemove(a); });
    };
    if (!a.signedIn) {
      c.append(el('p', 'note', 'Not logged in.'));
      var row = el('div', 'actions');
      row.append(signIn('Sign in', 'btn primary'));
      var rm = removable();
      if (rm) row.append(rm);
      c.append(row);
      return c;
    }
    var reset = p.weekReset ? new Date(p.weekReset) : null;
    c.append(
      bar('week', p.elapsed, 'time', reset ? 'Week resets ' + (window.ReverieTime?.format(reset) ?? reset.toLocaleString('en-US', { timeZone: 'UTC', timeZoneName: 'short' })) : ''),
      bar('used', p.weekly, p.recommendation || '', 'Weekly usage'),
      bar('5 h', p.fiveHour, '', '5-hour window')
    );
    var facts = el('div', 'facts');
    facts.append(
      fact('pace', p.pace === null || p.pace === undefined ? '-' : (p.pace > 0 ? '+' : '') + p.pace),
      fact('resets', et(p.weekReset)),
      fact(p.runsOutAt ? 'runs out' : 'at reset', p.runsOutAt ? et(p.runsOutAt) : pct(p.projected))
    );
    if (a.provider === 'openai') {
      var b = a.bankedResets;
      facts.append(fact('banked resets', !b ? 'unknown' : String(b.availableCount) + (b.earliestExpiresAt ? ' (earliest ' + et(b.earliestExpiresAt) + ')' : '')));
    }
    c.append(facts);
    var sessions = el('div', 'sessions');
    sessions.append(el('span', 'k', 'Agents on it:'));
    if (!a.sessions || !a.sessions.length) sessions.append(el('span', 'note', 'none'));
    else a.sessions.forEach(function (s) {
      var ch = el('span', 'chip', s.name);
      ch.title = s.mode + ' · ' + s.status;
      sessions.append(ch);
    });
    c.append(sessions);
    var again = signIn('Sign in again', 'link');
    again.title = 'Signed in to the wrong account, or the login expired';
    var tail = el('div', 'actions');
    tail.append(again);
    var rm2 = removable();
    if (rm2) tail.append(rm2);
    c.append(tail);
    return c;
  }

  var timer = null;
  async function load() {
    var res = await api('/api/plans');
    var err = $('error');
    if (!res.ok) {
      err.hidden = false;
      err.textContent = 'Plans unavailable: ' + res.error;
      return;
    }
    err.hidden = true;
    $('updated').textContent = 'updated ' + new Date(res.data.generatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    var cards = (res.data.accounts || []).map(card);
    if (!cards.length) cards.push(el('p', 'note', 'No accounts yet. Use Add account.'));
    $('grid').replaceChildren.apply($('grid'), cards);
  }

  // ─── Add account ───────────────────────────────────────────────────────────
  function openAdd() {
    var dlg = $('addDlg');
    var form = el('form');
    var input = el('input');
    input.required = true;
    input.maxLength = 64;
    input.placeholder = 'Account name, e.g. Work';
    input.setAttribute('aria-label', 'Account name');
    var provider = el('select');
    provider.setAttribute('aria-label', 'Provider');
    provider.append(new Option('Claude', 'anthropic'), new Option('ChatGPT / Codex', 'openai'));
    var add = el('button', 'btn primary', 'Add account');
    add.type = 'submit';
    var cancel = btn('Cancel', 'btn', function () { dlg.close(); });
    var error = el('p', 'err');
    error.setAttribute('role', 'alert');
    var row = el('div', 'row');
    row.append(add, cancel);
    form.append(input, provider, row, error);
    form.onsubmit = async function (e) {
      e.preventDefault();
      add.disabled = true;
      var res = await api('/api/subscription-profiles', { method: 'POST', body: { label: input.value, provider: provider.value } });
      if (!res.ok) { add.disabled = false; error.textContent = res.error; return; }
      var profile = res.data.profile;
      dlg.close();
      await load();
      startSignIn(profile.id, providerName(profile.provider) + ' · ' + profile.label);
    };
    dlg.replaceChildren(el('h3', '', 'Add subscription account'), form);
    dlg.showModal();
    input.focus();
  }

  // ─── Remove account ────────────────────────────────────────────────────────
  function confirmRemove(a) {
    var dlg = $('removeDlg');
    var error = el('p', 'err');
    error.setAttribute('role', 'alert');
    var go = btn('Remove account', 'btn primary');
    go.onclick = async function () {
      go.disabled = true;
      var res = await api('/api/subscription-profiles/' + encodeURIComponent(a.profileId), { method: 'DELETE' });
      if (!res.ok) { go.disabled = false; error.textContent = res.error; return; }
      dlg.close();
      load();
    };
    var row = el('div', 'row');
    row.append(go, btn('Cancel', 'btn', function () { dlg.close(); }));
    dlg.replaceChildren(
      el('h3', '', 'Remove ' + providerName(a.provider) + ' · ' + a.label + '?'),
      el('p', 'note', 'It is taken off this list. Its login stays on disk, nothing is deleted, and you can add it again later. Not possible while agents are running on it.'),
      row,
      error
    );
    dlg.showModal();
  }

  // ─── Sign in (one account) ─────────────────────────────────────────────────
  var sign = null;
  function copyBtn(text, label) {
    var b = btn(label, 'btn');
    b.onclick = async function () {
      try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; }
      catch (e) { b.textContent = 'Copy failed: select it by hand'; }
      setTimeout(function () { b.textContent = label; }, 2000);
    };
    return b;
  }
  async function startSignIn(accountId, title) {
    closeSignIn();
    var dlg = $('signDlg');
    var status = el('p', 'status', 'Starting sign-in…');
    status.setAttribute('role', 'status');
    var body = el('div');
    dlg.replaceChildren(el('h3', '', 'Sign in · ' + title), status, body);
    sign = { accountId: accountId, title: title, status: status, body: body, view: null, rendered: null, timer: null };
    var s = sign;
    dlg.onclose = function () { if (sign === s) closeSignIn(); };
    if (!dlg.open) dlg.showModal();
    var res = await api('/api/plans/accounts/' + encodeURIComponent(accountId) + '/login', { method: 'POST' });
    if (sign !== s) return;
    if (!res.ok) { status.textContent = res.error; status.className = 'status failed'; body.replaceChildren(btn('Close', 'btn', closeSignIn)); return; }
    render(res.data);
    s.timer = setInterval(poll, 1500);
  }
  async function poll() {
    var s = sign;
    if (!s || !s.view) return;
    var res = await api('/api/plans/logins/' + encodeURIComponent(s.view.id));
    if (sign !== s) return;
    render(res.ok ? res.data : Object.assign({}, s.view, { state: 'failed', message: 'Sign-in helper stopped.' }));
  }
  function render(view) {
    var s = sign;
    if (!s) return;
    s.view = view.id ? view : Object.assign({}, s.view, view);
    s.status.textContent = view.message || '';
    s.status.className = 'status ' + view.state;
    var settled = SETTLED.indexOf(view.state) >= 0;
    if (settled && s.timer) {
      clearInterval(s.timer);
      s.timer = null;
      if (view.state === 'signed_in') load();
    }
    var key = JSON.stringify([view.state, view.url, view.code, view.needsCode]);
    if (key === s.rendered) return; // a half-typed code survives each poll
    s.rendered = key;
    var parts = [];
    if (settled) {
      var row = el('div', 'row');
      if (view.state === 'signed_in') {
        row.append(btn('Done', 'btn primary', closeSignIn), btn('Wrong account? Sign in again', 'link', function () { startSignIn(s.accountId, s.title); }));
      } else {
        row.append(btn('Try again', 'btn primary', function () { startSignIn(s.accountId, s.title); }), btn('Close', 'btn', closeSignIn));
      }
      s.body.replaceChildren(row);
      row.querySelector('button').focus();
      return;
    }
    if (view.url) {
      var step = el('div', 'step');
      var open = el('a', 'btn primary', 'Open the sign-in page');
      open.href = view.url; open.target = '_blank'; open.rel = 'noopener noreferrer';
      var r = el('div', 'row');
      r.append(open, copyBtn(view.url, 'Copy link'));
      step.append(el('b', '', '1. Sign in'), r);
      if (view.qrSvg) {
        var det = el('details');
        var qr = el('div', 'qr');
        qr.innerHTML = view.qrSvg; // rendered by the server's qrcode library from the URL
        det.append(el('summary', '', 'On another device? Scan this'), qr);
        step.append(det);
      }
      parts.push(step);
    }
    if (view.code) {
      var st = el('div', 'step');
      var rr = el('div', 'row');
      rr.append(el('code', 'code', view.code), copyBtn(view.code, 'Copy code'));
      st.append(el('b', '', '2. Enter this code on that page'), rr, el('p', 'note', 'It expires in 15 minutes.'));
      parts.push(st);
    }
    if (view.needsCode) {
      var f = el('form');
      var input = el('input');
      input.placeholder = 'Paste the code from the sign-in page';
      input.autocomplete = 'off'; input.spellcheck = false;
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('aria-label', 'Sign-in code');
      var send = el('button', 'btn primary', 'Sign in');
      send.type = 'submit';
      f.append(el('b', '', '2. Paste the code it shows you'), input, send);
      f.onsubmit = async function (e) {
        e.preventDefault();
        var code = input.value.trim();
        if (!code || !s.view) return;
        send.disabled = true;
        var res = await api('/api/plans/logins/' + encodeURIComponent(s.view.id) + '/code', { method: 'POST', body: { code: code } });
        send.disabled = false;
        if (sign !== s) return;
        if (!res.ok) { s.status.textContent = res.error; s.status.className = 'status failed'; return; }
        render(res.data);
      };
      parts.push(f);
    }
    if (!parts.length) parts.push(el('p', 'note', 'Waiting for the sign-in page…'));
    parts.push(btn('Cancel sign-in', 'link', closeSignIn));
    s.body.replaceChildren.apply(s.body, parts);
  }
  function closeSignIn() {
    var s = sign;
    if (!s) return;
    sign = null;
    clearInterval(s.timer);
    var running = s.view && s.view.id && SETTLED.indexOf(s.view.state) < 0;
    if (running) api('/api/plans/logins/' + encodeURIComponent(s.view.id), { method: 'DELETE' });
    var dlg = $('signDlg');
    dlg.onclose = null;
    if (dlg.open) dlg.close();
  }

  $('addBtn').onclick = openAdd;
  $('refreshBtn').onclick = load;
  window.addEventListener('reverie-timezone-changed', load);
  load();
  timer = setInterval(function () { if (!document.hidden && !sign) load(); }, 60000);
})();
</script>
</body>
</html>
