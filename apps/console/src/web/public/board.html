<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board</title>
<link rel="stylesheet" href="/company-board.css">
</head>
<body class="board-page">
<div class="wrap">
  <header>
    <div>
      <h1><span id="co"></span> Board <span>· issues, milestones</span></h1>
      <div class="meta"><span class="clock" id="clock"></span><span id="built"></span></div>
    </div>
    <div class="tools"><a class="btn" id="company-link" href="/#company" target="_top" title="Plans, burn rate and people">Company</a><button class="btn" id="refresh">Refresh</button><button class="btn" id="theme">Theme</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="kpis" id="kpis"></section>

  <section class="panel" id="sec-decisions">
    <div class="phead"><h2>Waiting on you</h2><span class="hint" id="waitingHint">Decisions and polls. The recommendation is the named agent's, not the server's.</span></div>
    <div class="dcards" id="cards"></div>
    <details id="decidedBox" hidden><summary id="decidedSum"></summary><ul id="decided"></ul></details>
  </section>

  <section class="panel" id="sec-issues">
    <div class="phead">
      <div class="tools" id="tabs">
        <button class="btn on" data-tab="timeline">Timeline</button>
        <button class="btn" data-tab="kanban">Kanban</button>
      </div>
      <div class="tools" id="zoombtns">
        <button type="button" class="btn" data-zoom="out" aria-label="Zoom out timeline" title="Zoom out">−</button>
        <button type="button" class="btn" data-zoom="in" aria-label="Zoom in timeline" title="Zoom in">+</button>
        <button type="button" class="btn" data-z="fit">Fit</button>
        <button class="btn" data-z="now">Now ±4h</button>
        <button class="btn" data-z="today">Today</button>
        <button class="btn" data-z="3d">3 days</button>
        <button class="btn" data-z="2w">2 weeks</button>
      </div>
    </div>
    <div id="tl"></div>
    <div class="legend" id="legend"></div>
    <div id="kanban" hidden></div>
  </section>

  <section class="panel" id="sec-ms">
    <div class="phead"><h2>Milestones</h2><span class="hint">Progress comes from each milestone's issues.</span></div>
    <div class="grid2" id="milestones"></div>
  </section>

  <section class="cols">
    <div class="panel" id="sec-wins"><div class="phead"><h2>Wins</h2></div><ul class="list" id="wins"></ul></div>
    <div class="panel" id="sec-blockers"><div class="phead"><h2>Blockers</h2></div><ul class="list" id="blockers"></ul></div>
    <div class="panel" id="sec-pins"><div class="phead"><h2>Pinned</h2></div><ul class="list" id="pins"></ul></div>
  </section>
  <div class="foot" id="foot">Served inside Reverie. Refreshes every minute.</div>
</div>
<div class="tip" id="tip" hidden></div>
<script>
if (location.hash === '#sec-burn') location.replace('/#company-plans');
if (location.hash === '#sec-agents') location.replace('/#company-people');
const H = 3600e3, D = 24 * H;
const STATUS = {triage:'Triage', todo:'To do', doing:'Doing', blocked:'Blocked', done:'Done', wontdo:"Won't do"};
const COLS = ['triage', 'todo', 'doing', 'blocked', 'done'];
const KIND = {done:'Done', now:'In progress', plan:'Planned', gate:'Gate', blocked:'Blocked', cont:'Ongoing', sleep:'Sleep', triage:'Triage'};
const VERDICT = {ahead:['good', 'ahead'], 'on-track':['mute', 'on track'], behind:['bad', 'behind']};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let B = null, TZ = 'America/New_York', view = null, tlState = {}, tab = 'timeline', preset = 'now', timelineAnimation = 0;
const fmt = (t, o) => new Intl.DateTimeFormat('en-US', Object.assign({timeZone: TZ}, o)).format(new Date(t));
const hm = t => fmt(t, {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const dayLbl = t => fmt(t, {weekday: 'short', day: 'numeric', month: 'short'});
const parts = t => { const o = {}; new Intl.DateTimeFormat('en-US', {timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'}).formatToParts(new Date(t)).forEach(p => o[p.type] = p.value); return o; };
const startOfDay = t => { const p = parts(t); return t - ((+p.hour * 60 + +p.minute) * 60 + +p.second) * 1000; };
const etHour = t => +parts(t).hour;
const etDow = t => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts(t).weekday);
/** End of the due date (23:59 company time) as epoch ms. */
function dueMs(ymd) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(ymd || ''); if (!m) return NaN;
  const guess = Date.UTC(+m[1], +m[2] - 1, +m[3], 12); return startOfDay(guess) + D - 60e3; }

/* ---------- people, owners, links ---------- */
const roster = () => B.roster || [];
const person = id => roster().find(r => r.id === id);
const nameOf = id => (person(id) || {}).name || id || '';
const ownerKey = i => B.ownerIds && Object.hasOwn(B.ownerIds, i.id) && typeof B.ownerIds[i.id] === 'string'
  ? B.ownerIds[i.id] : i.owner || ('label:' + (i.ownerLabel || ''));
const ownerName = i => (person(ownerKey(i)) || {}).name || (i.owner ? nameOf(i.owner) : (i.ownerLabel || 'Unassigned'));
function linkInfo(l) {
  const u = String((l && l.url) || '');
  if (!/^https?:\/\//i.test(u)) return null;
  const m = /^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(issues|pull)\/(\d+)/i.exec(u);
  let text;
  if (m) text = m[2] + '#' + m[4];
  else { try { text = new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return null; } if (l.kind === 'report') text = 'report · ' + text; }
  return {href: u, text};
}
const linksHtml = i => (i.links || []).map(linkInfo).filter(Boolean).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.text)}</a>`).join(' · ');
const msTitle = id => { const m = (B.milestones || []).find(x => x.id === id); return m ? m.title : ''; };

/** Colour class of an issue on the timeline. */
function kindOf(i) {
  const tags = i.tags || [];
  if (i.status === 'done') return 'done';
  if (i.status === 'blocked') return 'blocked';
  if (i.status === 'triage') return 'triage';
  if (tags.includes('sleep')) return 'sleep';
  if (tags.includes('gate')) return 'gate';
  if (i.status === 'doing') return tags.includes('continuous') ? 'cont' : 'now';
  return 'plan';
}
const onTimeline = i => i.status !== 'wontdo' && Number.isFinite(i.start) && Number.isFinite(i.end) && i.end >= i.start;
const overdue = (i, now) => i.status !== 'done' && i.status !== 'wontdo' && Number.isFinite(i.end) && i.end <= now;

/* ---------- theme, clock ---------- */
(function theme() {
  let saved = null; try { saved = localStorage.getItem('board-theme'); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx;
    try { localStorage.setItem('board-theme', nx); } catch (e) {}
    if (B) render();
  };
})();
function tick() {
  document.getElementById('clock').textContent = fmt(Date.now(), {weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}) + ' ' + zoneShort();
  if (B && tab === 'timeline') drawTimeline();
}
const zoneShort = () => { try { return (new Intl.DateTimeFormat('en-US', {timeZone: TZ, timeZoneName: 'short'}).formatToParts(new Date()).find(p => p.type === 'timeZoneName') || {}).value || 'ET'; } catch (e) { return 'ET'; } };

/* ---------- loading ---------- */
let failures = 0;
async function load() {
  const banner = document.getElementById('banner');
  try {
    const r = await fetch('/api/board', {cache: 'no-store', credentials: 'same-origin', headers: {accept: 'application/json'}});
    if (r.status === 401 || r.status === 403) {
      // The login expired: reload once so the console can ask again; never loop.
      let tried = null; try { tried = sessionStorage.getItem('board-reloaded'); } catch (e) {}
      if (!tried || Date.now() - +tried > 60e3) { try { sessionStorage.setItem('board-reloaded', String(Date.now())); } catch (e) {} location.reload(); return; }
      throw new Error('Sign in to the console, then reload (HTTP ' + r.status + ')');
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // The API wraps replies as {success, data}; a bare view is accepted too.
    const j = await r.json();
    if (j && j.success === false) throw new Error(j.error || 'refused');
    const next = j && j.data ? j.data : j;
    if (!next || !Array.isArray(next.issues)) throw new Error('unexpected reply');
    const first = !B;
    B = next; TZ = B.timeZone || TZ; failures = 0; banner.hidden = true;
    if (first) view = presetView(preset);
    render();
  } catch (e) {
    failures++;
    banner.hidden = false;
    banner.textContent = (B ? 'Could not refresh the board (' : 'Could not load the board (') + e.message + '). ' + (B ? 'Showing the last data; ' : '') + 'trying again in a minute.';
  }
}
document.getElementById('refresh').onclick = () => load();
setInterval(load, 60e3);
setInterval(tick, 30e3);
load().then(tick);

const undecidedPolls = () => (B.polls || []).filter(p => !(p.ownerVote || []).length);
function render() {
  document.getElementById('co').textContent = (B.company && B.company.name) || '';
  document.title = ((B.company && B.company.name) ? B.company.name + ' ' : '') + 'Board';
  document.getElementById('built').textContent = 'Data built ' + dayLbl(B.built) + ' ' + hm(B.built) + ' ' + zoneShort();
  kpis(); drawTimeline(); kanban(); milestones(); lists(); cards(); tick();
}

/* ---------- KPIs ---------- */
const num = (v, d) => v == null ? '–' : (d == null ? v : Math.round(v * 10 ** d) / 10 ** d);
function kpis() {
  const now = Date.now(), today = startOfDay(now);
  const issues = B.issues || [];
  const winsToday = (B.wins || []).filter(w => w.at >= today).length;
  const blockers = (B.blockers || []).filter(b => !b.clearedAt), high = blockers.filter(b => b.sev === 'high').length;
  const decisions = (B.decisions || []).filter(d => !d.clearedAt);
  const late = issues.filter(i => overdue(i, now)).length, triage = issues.filter(i => i.status === 'triage').length;
  const k = [
    ['good', winsToday, 'wins today', 'sec-wins'],
    [late ? 'bad' : 'good', late, 'issues overdue', 'sec-issues'],
    [triage ? 'warn' : 'good', triage, 'to triage', 'sec-issues'],
    [high ? 'bad' : blockers.length ? 'warn' : 'good', blockers.length, `blockers (${high} high)`, 'sec-blockers'],
    [decisions.length + undecidedPolls().length ? 'warn' : 'good', decisions.length + undecidedPolls().length, 'waiting on you', 'sec-decisions'],
  ];
  const el = document.getElementById('kpis');
  el.innerHTML = k.map(([c, v, l, id]) => `<div class="kpi ${c}" data-go="${id}"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('');
  el.querySelectorAll('.kpi').forEach(x => x.onclick = () => document.getElementById(x.dataset.go).scrollIntoView({behavior: 'smooth'}));
}

/* ---------- Tabs ---------- */
document.getElementById('tabs').onclick = e => {
  const t = e.target.dataset && e.target.dataset.tab; if (!t) return;
  tab = t;
  document.querySelectorAll('#tabs .btn').forEach(b => b.classList.toggle('on', b === e.target));
  const tl = t === 'timeline';
  document.getElementById('tl').hidden = !tl; document.getElementById('legend').hidden = !tl;
  document.getElementById('zoombtns').hidden = !tl; document.getElementById('kanban').hidden = tl;
  if (B) { if (tl) drawTimeline(); else kanban(); }
};

/* ---------- Timeline ---------- */
function timelineBounds() {
  const now = Date.now(), d0 = startOfDay(now);
  let lo = d0 - D, hi = d0 + 14 * D;
  (B.issues || []).filter(onTimeline).forEach(i => { lo = Math.min(lo, startOfDay(i.start)); hi = Math.max(hi, i.end); });
  (B.milestones || []).forEach(m => { const t = dueMs(m.due); if (Number.isFinite(t)) hi = Math.max(hi, t); });
  return {start: lo, end: Math.min(hi, lo + 60 * D)};
}
function presetView(z) {
  const now = Date.now(), d0 = startOfDay(now);
  if (z === 'now') return {s: now - 4 * H, e: now + 4 * H};
  if (z === 'today') return {s: d0 + 6 * H, e: d0 + 24 * H};
  if (z === '3d') return {s: d0 - 12 * H, e: d0 + 2.5 * D};
  const b = timelineBounds(); return {s: b.start, e: b.end};
}
document.getElementById('zoombtns').onclick = e => {
  const button = e.target.closest('button'); if (!button || !B || !view) return;
  if (button.dataset.zoom) { zoomTimeline(button.dataset.zoom === 'in' ? 1 / 1.5 : 1.5); return; }
  const z = button.dataset.z; if (!z) return;
  preset = z; animateTo(presetView(z));
  document.querySelectorAll('#zoombtns .btn').forEach(b => b.classList.toggle('on', b === button));
};
function animateTo(v) {
  cancelAnimationFrame(timelineAnimation);
  const a = {...view}, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 260), q = 1 - Math.pow(1 - k, 3);
    view = {s: a.s + (v.s - a.s) * q, e: a.e + (v.e - a.e) * q}; drawTimeline(); timelineAnimation = k < 1 ? requestAnimationFrame(step) : 0; };
  timelineAnimation = requestAnimationFrame(step);
}
function clampView(v) {
  const b = timelineBounds(), lo = b.start - D, hi = b.end + D, minSpan = 1.5 * H, maxSpan = hi - lo;
  const span = Math.max(minSpan, Math.min(maxSpan, v.e - v.s));
  const s = Math.max(lo, Math.min(hi - span, v.s));
  return {s, e: s + span};
}
function zoomTimeline(factor, anchor) {
  if (!view) return;
  cancelAnimationFrame(timelineAnimation); timelineAnimation = 0;
  const t = anchor ?? (view.s + view.e) / 2;
  view = clampView({s: t - (t - view.s) * factor, e: t + (view.e - t) * factor});
  preset = null; hideTip(); drawTimeline();
  document.querySelectorAll('#zoombtns .btn').forEach(b => b.classList.remove('on'));
}
/** One row per owner. Today's hour-scale issues replace that owner's overlapping day-scale ones. */
function rowsForView() {
  const today = startOfDay(Date.now()), tomorrow = today + D, by = new Map();
  (B.issues || []).filter(onTimeline).forEach(i => { const k = ownerKey(i); if (!by.has(k)) by.set(k, []); by.get(k).push(i); });
  const order = roster().map(r => r.id);
  const keys = [...by.keys()].sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b); });
  return keys.map(k => {
    const all = by.get(k), p = person(k);
    const hasHours = all.some(i => i.scale === 'hour');
    const items = all.filter(i => !(hasHours && i.scale === 'day' && i.start < tomorrow && i.end > today && i.end - i.start < D))
      .map(i => ({i, lane: 0}));
    const lanes = [];
    items.slice().sort((a, b) => a.i.start - b.i.start || (b.i.end - b.i.start) - (a.i.end - a.i.start)).forEach(b => {
      let n = lanes.findIndex(end => end <= b.i.start); if (n < 0) { n = lanes.length; lanes.push(0); }
      lanes[n] = Math.max(b.i.end, b.i.start + 30 * 60e3); b.lane = n;
    });
    return {key: k, who: p ? p.name : ownerName(all[0]), sub: p ? (p.position || '') : '', items, lanes: Math.max(1, lanes.length)};
  });
}
function tickStep(span, maxTicks) {
  const steps = [H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D];
  return steps.find(s => span / s <= maxTicks) || 7 * D;
}
function drawTimeline() {
  const host = document.getElementById('tl');
  if (!B || tab !== 'timeline') return;
  const rows = rowsForView();
  const W = Math.max(320, host.clientWidth), narrow = W < 600;
  const LW = narrow ? 64 : 112, AX = 34, LANE = narrow ? 22 : 22, PAD = 6;
  if (!rows.length) { host.innerHTML = '<div class="empty">No issues with a start and end yet. File one with <code>reverie board issue add --start … --end …</code>.</div>'; return; }
  let y = AX; rows.forEach(r => { r._y = y; r._h = r.lanes * LANE + PAD * 2; y += r._h; });
  const Ht = y + 30, PW = W - LW - 8;
  const X = t => LW + (t - view.s) / (view.e - view.s) * PW;
  const span = view.e - view.s, step = tickStep(span, Math.max(3, Math.floor(PW / (narrow ? 62 : 78)))), now = Date.now();
  const kc = k => css('--' + (k in KIND ? k : 'plan'));
  let s = `<svg viewBox="0 0 ${W} ${Ht}" height="${Ht}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="plot"><rect x="${LW}" y="0" width="${PW}" height="${Ht}"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="${css('--gate')}" opacity=".35"/></pattern>
    <pattern id="late" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="${css('--bad')}" opacity=".5"/></pattern></defs>`;
  s += `<g clip-path="url(#plot)">`;
  for (let d = startOfDay(view.s) - D; d < view.e + D; d += D) {
    const dow = etDow(d + H);
    if (dow === 0 || dow === 6) s += `<rect x="${X(d)}" y="${AX}" width="${X(d + D) - X(d)}" height="${Ht - AX}" fill="${css('--weekend')}"/>`;
    s += `<rect x="${X(d)}" y="${AX}" width="${X(d + 7 * H) - X(d)}" height="${Ht - AX}" fill="${css('--night')}"/>`;
    s += `<rect x="${X(d + 23 * H)}" y="${AX}" width="${X(d + D) - X(d + 23 * H)}" height="${Ht - AX}" fill="${css('--night')}"/>`;
  }
  const d0v = startOfDay(view.s);
  for (let t = d0v + Math.ceil((view.s - d0v) / step) * step; t <= view.e; t += step) {
    const x = X(t), mid = etHour(t) === 0;
    s += `<line x1="${x}" x2="${x}" y1="${AX - 4}" y2="${Ht}" stroke="${css(mid ? '--line' : '--grid')}" stroke-width="${mid ? 1.2 : 1}"/>`;
    const lbl = step >= D ? dayLbl(t) : (mid ? dayLbl(t) : hm(t));
    // Leave out a label that would sit under the "now" chip (44 px wide, centred on the now line).
    if (now > view.s && now < view.e && x + 4 < X(now) + 24 && x + 4 + lbl.length * 6.2 > X(now) - 24) continue;
    s += `<text x="${x + 4}" y="${AX - 12}" font-size="11" fill="${css(mid ? '--fg' : '--muted')}" font-weight="${mid ? 600 : 400}">${esc(lbl)}</text>`;
  }
  const resets = new Map(), bottom = [];
  (B.planBurn || []).forEach(p => { if (p.reset > view.s && p.reset < view.e) { const k = Math.round(p.reset / 60e3); resets.set(k, (resets.get(k) || []).concat(p.name)); } });
  resets.forEach((names, k) => { const x = X(k * 60e3), text = '↻ ' + (names.length > 1 ? names.length + ' plans reset' : names[0] + ' reset');
    s += `<line x1="${x}" x2="${x}" y1="${AX}" y2="${Ht}" stroke="${css('--accent')}" stroke-dasharray="3 4" opacity=".7"/>`;
    bottom.push({x, text, color: css('--accent'), weight: 400}); });
  (B.marks || []).forEach(m => { if (m.t > view.s && m.t < view.e) { const x = X(m.t);
    s += `<line x1="${x}" x2="${x}" y1="${AX}" y2="${Ht}" stroke="${css('--gate')}" stroke-width="1.2"/>`;
    bottom.push({x, text: m.label, color: css('--gate'), weight: 600}); } });
  // Labels sit on up to three staggered lines; one that would still touch another (within 40 px) is left out.
  // Its line stays, and a tap on the timeline shows nothing extra, so keep the text short.
  const ends = [-1e9, -1e9, -1e9];
  bottom.sort((a, b) => a.x - b.x).forEach(l => {
    const w = l.text.length * 5.8, row = ends.findIndex(e => l.x + 3 - e >= 40);
    if (row < 0) return;
    ends[row] = l.x + 3 + w;
    s += `<text x="${l.x + 3}" y="${Ht - 6 - row * 12}" font-size="10" fill="${l.color}" font-weight="${l.weight}">${esc(l.text)}</text>`;
  });
  rows.forEach((r, ri) => {
    if (ri % 2) s += `<rect x="${LW}" y="${r._y}" width="${PW}" height="${r._h}" fill="${css('--panel2')}" opacity=".55"/>`;
    r.items.forEach((b, bj) => {
      const i = b.i, kind = kindOf(i);
      const x1 = Math.max(LW - 2, X(i.start)), x2 = Math.min(W, X(i.end)), w = Math.max(3, x2 - x1);
      if (x2 < LW || x1 > W) return;
      const by = r._y + PAD + b.lane * LANE, bh = LANE - 5, c = kc(kind);
      const fill = kind === 'gate' ? 'url(#hatch)' : c;
      const op = kind === 'plan' || kind === 'triage' ? .5 : kind === 'cont' ? .55 : .92;
      s += `<g class="bar" data-r="${ri}" data-b="${bj}"><rect x="${x1}" y="${by}" width="${w}" height="${bh}" rx="4" fill="${fill}" fill-opacity="${op}" stroke="${kind === 'gate' || kind === 'now' ? c : 'none'}" stroke-width="1.2"/>`;
      if (overdue(i, now)) { const lx1 = Math.max(x2, LW), lx2 = Math.min(W, X(now)); if (lx2 > lx1) s += `<rect x="${lx1}" y="${by + 2}" width="${lx2 - lx1}" height="${bh - 4}" fill="url(#late)" stroke="${css('--bad')}" stroke-width="1" rx="2"/>`; }
      if (w > 34) {
        const tc = (kind === 'plan' || kind === 'cont' || kind === 'gate' || kind === 'triage') ? css('--fg') : '#fff';
        const maxc = Math.floor((w - 10) / 6.1), lab = i.title.length > maxc ? i.title.slice(0, Math.max(1, maxc - 1)) + '…' : i.title;
        s += `<text x="${x1 + 6}" y="${by + bh / 2 + 4}" font-size="11.5" fill="${tc}" pointer-events="none">${esc(lab)}</text>`;
      }
      // Planned vs actual: a diamond where it was really finished (green = on time or early, red = late).
      if (i.status === 'done' && Number.isFinite(i.doneAt)) { const dx = X(i.doneAt);
        if (dx > LW && dx < W) s += `<path d="M${dx} ${by - 1} l4.5 ${bh / 2 + 1} l-4.5 ${bh / 2 + 1} l-4.5 -${bh / 2 + 1} z" fill="${i.doneAt <= i.end ? css('--done') : css('--bad')}" stroke="${css('--panel')}" stroke-width="1.2"/>`; }
      s += `</g>`;
    });
  });
  // Milestones: a marker per due date.
  (B.milestones || []).forEach((m, k) => { const t = dueMs(m.due); if (t > view.s && t < view.e) { const x = X(t);
    s += `<line x1="${x}" x2="${x}" y1="${AX}" y2="${Ht}" stroke="${css('--ms')}" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    s += `<path d="M${x} ${AX + 1} l6 6 l-6 6 l-6 -6 z" fill="${css('--ms')}"/>`;
    s += `<text x="${x + 9}" y="${AX + 12 + (k % 2) * 11}" font-size="10" fill="${css('--ms')}" font-weight="600">${esc(m.title)}</text>`; } });
  if (now > view.s && now < view.e) { const x = X(now);
    s += `<line x1="${x}" x2="${x}" y1="${AX - 6}" y2="${Ht}" stroke="${css('--now-line')}" stroke-width="2"/>`;
    s += `<rect x="${x - 22}" y="${AX - 22}" width="44" height="15" rx="4" fill="${css('--now-line')}"/><text x="${x}" y="${AX - 11}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">${hm(now)}</text>`; }
  s += `</g><rect x="0" y="0" width="${LW}" height="${Ht}" fill="${css('--panel')}"/>`;
  rows.forEach(r => {
    s += `<line x1="0" x2="${W}" y1="${r._y}" y2="${r._y}" stroke="${css('--grid')}"/>`;
    const nm = r.who.length > (narrow ? 9 : 16) ? r.who.slice(0, narrow ? 8 : 15) + '…' : r.who;
    s += `<text x="12" y="${r._y + 19}" font-size="13" font-weight="600" fill="${css('--fg')}">${esc(nm)}</text>`;
    if (!narrow && r.sub) s += `<text x="12" y="${r._y + 34}" font-size="11" fill="${css('--muted')}">${esc(r.sub.slice(0, 18))}</text>`;
  });
  s += `<line x1="${LW}" x2="${LW}" y1="0" y2="${Ht}" stroke="${css('--line')}"/></svg>`;
  host.innerHTML = s;
  tlState = {rows, X, LW, PW, W};
  host.querySelectorAll('.bar').forEach(g => {
    const b = rows[g.dataset.r].items[g.dataset.b], i = b.i, kind = kindOf(i);
    const show = e => { const p = e.touches ? e.touches[0] : e; tip(p.clientX, p.clientY, issueTip(i, kind)); };
    g.addEventListener('mousemove', show); g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', show);
  });
  const lg = document.getElementById('legend');
  if (!lg.innerHTML) lg.innerHTML =
    ['done', 'now', 'plan', 'gate', 'blocked', 'cont', 'triage'].map(k => `<span><i style="background:${k === 'gate' ? 'transparent;border:1.5px solid ' + css('--gate') : css('--' + k)}"></i>${KIND[k]}</span>`).join('') +
    `<span><i style="background:${css('--ms')}"></i>Milestone</span><span><i style="background:${css('--now-line')}"></i>Now</span>` +
    `<span class="hint">◆ finished (green on time, red late) · red hatch = overdue · Ctrl/Cmd+scroll or pinch to zoom · drag to pan · tap a bar</span>`;
}
function issueTip(i, kind) {
  const now = Date.now();
  const when = i.scale === 'day' ? `${dayLbl(i.start)}${i.end - i.start > D ? ' → ' + dayLbl(i.end) : ''}` : `${dayLbl(i.start)}, ${hm(i.start)}–${hm(i.end)}`;
  let actual = '';
  if (i.status === 'done' && Number.isFinite(i.doneAt)) actual = `<br>Finished ${dayLbl(i.doneAt)} ${hm(i.doneAt)} (${i.doneAt <= i.end ? 'on time' : Math.round((i.doneAt - i.end) / H) + 'h late'})`;
  else if (overdue(i, now)) actual = `<br><span style="color:${css('--bad')}">Overdue ${Math.max(1, Math.round((now - i.end) / H))}h</span>`;
  const ms = i.milestoneId ? msTitle(i.milestoneId) : '', lk = linksHtml(i);
  return `<b>${esc(i.title)}</b>${esc(ownerName(i))} <span class="k" style="background:${css('--' + (kind in KIND ? kind : 'plan'))}">${esc(STATUS[i.status] || i.status)}</span><br>${esc(when)} ${esc(zoneShort())}${actual}` +
    (i.reason ? `<br>${esc(i.reason)}` : '') + (ms ? `<br>Milestone: ${esc(ms)}` : '') + (lk ? `<br>${lk}` : '');
}
const tipEl = document.getElementById('tip');
function tip(x, y, h) { tipEl.innerHTML = h; tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect(); tipEl.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 12)) + 'px'; tipEl.style.top = Math.max(8, y - r.height - 12) + 'px'; }
function hideTip() { tipEl.hidden = true; }

(function interact() {
  const host = document.getElementById('tl');
  const tAt = cx => { const r = host.getBoundingClientRect(); return view.s + (cx - r.left - tlState.LW) / tlState.PW * (view.e - view.s); };
  const unpreset = () => document.querySelectorAll('#zoombtns .btn').forEach(b => b.classList.remove('on'));
  host.addEventListener('wheel', e => {
    if (!tlState.PW || !(e.ctrlKey || e.metaKey) || !e.deltaY) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? host.clientHeight : 1;
    zoomTimeline(Math.exp(e.deltaY * unit * 0.0015), tAt(e.clientX));
  }, {passive: false});
  // One finger: a vertical swipe scrolls the page (touch-action: pan-y); a horizontal drag pans the time axis.
  let drag = null, pinch = null;
  host.addEventListener('pointerdown', e => { drag = {x: e.clientX, v: {...view}, moved: false}; });
  addEventListener('pointermove', e => { if (!drag || pinch || !tlState.PW) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 3) drag.moved = true;
    if (!drag.moved) return; hideTip(); const dt = -dx / tlState.PW * (drag.v.e - drag.v.s); view = clampView({s: drag.v.s + dt, e: drag.v.e + dt}); drawTimeline(); unpreset(); });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointercancel', () => { drag = null; });
  host.addEventListener('touchstart', e => { if (e.touches.length === 2) { const [a, b] = e.touches;
    pinch = {d: Math.abs(a.clientX - b.clientX) || 1, c: tAt((a.clientX + b.clientX) / 2), v: {...view}}; } }, {passive: true});
  host.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { e.preventDefault(); const [a, b] = e.touches;
    const k = pinch.d / (Math.abs(a.clientX - b.clientX) || 1), t = pinch.c;
    view = clampView({s: t - (t - pinch.v.s) * k, e: t + (pinch.v.e - t) * k}); drawTimeline(); unpreset(); } }, {passive: false});
  host.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
  addEventListener('resize', () => { if (B) drawTimeline(); });
  document.addEventListener('click', e => { if (!e.target.closest('.bar')) hideTip(); });
})();

/* ---------- Kanban ---------- */
function card(i) {
  const now = Date.now(), lk = linksHtml(i), ms = i.milestoneId ? msTitle(i.milestoneId) : '';
  const late = overdue(i, now);
  return `<div class="card"><div>${esc(i.title)}</div>
    <div class="meta2"><span class="chip">${esc(ownerName(i))}</span>${late ? `<span class="chip" style="color:var(--bad);border-color:var(--bad)">overdue ${Math.max(1, Math.round((now - i.end) / H))}h</span>` : ''}
    ${Number.isFinite(i.end) ? `<span class="chip">due ${esc(dayLbl(i.end))}</span>` : ''}${ms ? `<span class="chip">◆ ${esc(ms)}</span>` : ''}
    ${(i.tags || []).map(t => `<span class="chip">#${esc(t)}</span>`).join('')}</div>
    ${i.reason ? `<div class="why">${esc(i.reason)}</div>` : ''}${lk ? `<div class="meta2">${lk}</div>` : ''}</div>`;
}
function kanban() {
  const host = document.getElementById('kanban');
  if (!B || tab !== 'kanban') return;
  const issues = (B.issues || []).slice().sort((a, b) => (a.end || 9e15) - (b.end || 9e15) || b.updatedAt - a.updatedAt);
  const col = s => issues.filter(i => i.status === s);
  host.innerHTML = `<div class="ktabs">` + COLS.map((s, n) => `<button data-col="${n}"><b>${col(s).length}</b>${STATUS[s]}</button>`).join('') + `</div><div class="kan">` + COLS.map(s => {
    const items = col(s).slice(0, s === 'done' ? 40 : 200);
    return `<div class="kcol"><h3><span><i style="background:${css('--' + (s === 'todo' ? 'plan' : s === 'doing' ? 'now' : s))}"></i>${STATUS[s]}</span><span>${col(s).length}</span></h3>
      <div class="kcards">${items.map(card).join('') || '<div class="hint" style="padding:6px">Nothing here</div>'}</div></div>`; }).join('') + `</div>` +
    (col('wontdo').length ? `<details class="wontdo"><summary>Won't do (${col('wontdo').length})</summary><div class="kcards">${col('wontdo').map(card).join('')}</div></details>` : '');
}

(function kanbanStrip() {
  const host = document.getElementById('kanban');
  const kan = () => host.querySelector('.kan');
  const mark = () => { const k = kan(); if (!k) return; const cols = [...k.children];
    let best = 0; cols.forEach((c, n) => { if (Math.abs(c.offsetLeft - k.offsetLeft - k.scrollLeft) < Math.abs(cols[best].offsetLeft - k.offsetLeft - k.scrollLeft)) best = n; });
    host.querySelectorAll('.ktabs button').forEach((b, n) => b.classList.toggle('on', n === best)); };
  host.addEventListener('click', e => { const b = e.target.closest('.ktabs button'); if (!b) return;
    const k = kan(), c = k && k.children[+b.dataset.col]; if (c) k.scrollTo({left: c.offsetLeft - k.offsetLeft - 14, behavior: 'smooth'}); });
  host.addEventListener('scroll', mark, true);
  new MutationObserver(mark).observe(host, {childList: true});
})();

/* ---------- Milestones ---------- */
function paceBadge(p) { const v = VERDICT[p && p.verdict] || VERDICT['on-track']; return `<span class="badge ${v[0]}">${v[1]}</span>`; }
function milestones() {
  const el = document.getElementById('milestones'), list = (B.milestones || []).slice().sort((a, b) => a.due.localeCompare(b.due)), now = Date.now();
  if (!list.length) { el.innerHTML = '<div class="empty">No milestones yet. Add one with <code>reverie board milestone add --title … --due YYYY-MM-DD</code>.</div>'; return; }
  el.innerHTML = list.map(m => {
    const p = (B.pace && B.pace.milestones && B.pace.milestones[m.id]) || null;
    const total = p ? p.total : 0, done = p ? p.done : 0, pct = total ? Math.round(done / total * 100) : 0;
    const left = Math.ceil((dueMs(m.due) - now) / D);
    const due = left < 0 ? `${-left}d past due` : left === 0 ? 'due today' : `${left}d left`;
    return `<div class="ms"><h3>${esc(m.title)}${paceBadge(p)}</h3>
      <div class="who">Due ${esc(m.due)} · ${esc(due)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="stats"><div><b>${done}/${total}</b>issues done</div><div><b>${p ? p.overdue : 0}</b>overdue</div><div><b>${p ? p.early : 0}</b>finished early</div></div></div>`;
  }).join('');
}

/* ---------- Lists ---------- */
function when(t) { return startOfDay(t) === startOfDay(Date.now()) ? hm(t) : dayLbl(t).split(',')[0]; }
function lists() {
  const sevc = {high: '--bad', med: '--warn', low: '--plan'};
  const fill = (id, rows, none) => { document.getElementById(id).innerHTML = rows.length ? rows.join('') : `<li><span class="hint">${none}</span></li>`; };
  fill('wins', (B.wins || []).slice().sort((a, b) => b.at - a.at).slice(0, 30).map(w =>
    `<li><span class="t">${when(w.at)}</span><div>${esc(w.text)}<div class="who">${esc(nameOf(w.who))}</div></div></li>`), 'No wins yet');
  fill('blockers', (B.blockers || []).filter(b => !b.clearedAt).map(b =>
    `<li><span class="sev" style="background:${css(sevc[b.sev] || '--plan')}"></span><div>${esc(b.text)}<div class="who">${esc(nameOf(b.who))} · owner ${esc(nameOf(b.owner))} · since ${when(b.since)}</div></div></li>`), 'No open blockers');
  fill('pins', (B.pins || []).slice(0, 12).map(p =>
    `<li><span class="t">${when(p.at)}</span><div>${esc(String(p.text).slice(0, 240))}<div class="who">${esc(p.room)} · ${esc(p.by)}</div></div></li>`), 'Nothing pinned');
}

/* ---------- Waiting on you: decision and poll cards ---------- */
// A card shows the summary, the named recommendation and the trade-off; the full text folds away. Voting uses the chat
// room's own vote path (the owner votes as "user"); a decision is marked decided with the board's clear path.
const cardErr = {};
function recLine(rec, label) {
  if (!rec) return '<div class="rec none">No recommendation yet</div>';
  return `<div class="rec">Recommended: <b>${esc(label || rec.option)}</b>${rec.reason ? ' — ' + esc(rec.reason) : ''}<div class="who">by ${esc(rec.by)}</div></div>`;
}
function pollCard(p) {
  const key = p.roomId + ':' + p.messageId;
  const recId = (p.recommendation && p.recommendation.option) || p.recommended;
  const recOpt = p.options.find(o => o.id === recId);
  const rec = p.recommendation || (p.recommended ? {option: p.recommended, reason: '', by: 'poll author'} : null);
  return `<article class="dcard poll" data-key="${esc(key)}">
    <div class="who">Poll · ${esc(p.room)} · ${when(p.createdAt)}${p.closesAt ? ' · closes ' + when(p.closesAt) : ''}</div>
    <h3>${esc(p.summary || p.question)}</h3>
    ${recLine(rec, recOpt && recOpt.label)}
    ${p.tradeoff ? `<div class="trade"><b>Trade-off:</b> ${esc(p.tradeoff)}</div>` : ''}
    <div class="opts">${p.options.map((o, i) => `<button type="button" class="btn${o.id === recId ? ' recd' : ''}" data-vote="${esc(key)}" data-opt="${esc(o.id)}">${i + 1}. ${esc(o.label)}${o.id === recId ? ' ★' : ''}<span class="n">${o.votes}</span></button>`).join('')}</div>
    ${cardErr[key] ? `<div class="err">${esc(cardErr[key])}</div>` : ''}
    ${p.summary ? `<details><summary>Full question</summary><div class="sum">${esc(p.question)}</div></details>` : ''}
  </article>`;
}
function decisionCard(d) {
  const key = 'd:' + d.id;
  return `<article class="dcard" data-key="${esc(key)}">
    <div class="who">Decision · ${esc(d.where || 'board')} · ${when(d.at)}</div>
    <h3>${esc(d.summary || d.text)}</h3>
    ${recLine(d.recommendation)}
    ${d.tradeoff ? `<div class="trade"><b>Trade-off:</b> ${esc(d.tradeoff)}</div>` : ''}
    <div class="opts"><button type="button" class="btn" data-clear="${esc(d.id)}">Mark decided</button></div>
    ${cardErr[key] ? `<div class="err">${esc(cardErr[key])}</div>` : ''}
    ${d.summary ? `<details><summary>Full text</summary><div class="sum">${esc(d.text)}</div></details>` : ''}
  </article>`;
}
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', credentials: 'same-origin', headers: {'content-type': 'application/json', accept: 'application/json'}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.success === false) throw new Error(j.error || j.message || 'HTTP ' + r.status);
  return j;
}
function cards() {
  const open = (B.decisions || []).filter(d => !d.clearedAt).sort((a, b) => a.at - b.at);
  const polls = (B.polls || []).slice().sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));
  const waiting = polls.filter(p => !(p.ownerVote || []).length);
  const html = [...open.map(decisionCard), ...waiting.map(pollCard)];
  document.getElementById('cards').innerHTML = html.length ? html.join('') : '<div class="empty">Nothing is waiting on you.</div>';
  document.getElementById('waitingHint').textContent = `${open.length} decision${open.length === 1 ? '' : 's'}, ${waiting.length} poll${waiting.length === 1 ? '' : 's'}. Recommendations are the named agent's, not the server's.`;
  // Decided history: polls you voted on (still open, so you can change the vote) and cleared decisions.
  const voted = polls.filter(p => (p.ownerVote || []).length).reverse();
  const cleared = (B.decisions || []).filter(d => d.clearedAt).sort((a, b) => b.clearedAt - a.clearedAt).slice(0, 20);
  const box = document.getElementById('decidedBox');
  box.hidden = !voted.length && !cleared.length;
  document.getElementById('decidedSum').textContent = `Decided (${voted.length + cleared.length})`;
  document.getElementById('decided').innerHTML = [
    ...voted.map(p => `<li>🗳️ ${esc(p.summary || p.question)} — you chose <b>${esc(p.options.filter(o => p.ownerVote.includes(o.id)).map(o => o.label).join(', '))}</b> <button type="button" class="btn" data-undo="${esc(p.roomId + ':' + p.messageId)}">Change</button></li>`),
    ...cleared.map(d => `<li>✅ ${esc(d.summary || d.text)} <span class="hint">${when(d.clearedAt)}</span></li>`),
  ].join('');
  const root = document.getElementById('sec-decisions');
  root.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    const k = b.dataset.vote, roomId = k.slice(0, k.indexOf(':')), messageId = k.slice(k.indexOf(':') + 1);
    root.querySelectorAll(`[data-vote="${CSS.escape(b.dataset.vote)}"]`).forEach(x => x.disabled = true);
    try {
      await post(`/api/chatrooms/${encodeURIComponent(roomId)}/messages/${encodeURIComponent(messageId)}/poll/vote`, {options: [b.dataset.opt]});
      delete cardErr[b.dataset.vote];
    } catch (e) { cardErr[b.dataset.vote] = 'Vote not saved: ' + e.message; }
    await load();
  });
  root.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    const k = b.dataset.undo, roomId = k.slice(0, k.indexOf(':')), messageId = k.slice(k.indexOf(':') + 1);
    b.disabled = true;
    try { await post(`/api/chatrooms/${encodeURIComponent(roomId)}/messages/${encodeURIComponent(messageId)}/poll/vote`, {options: []}); }
    catch (e) { cardErr[b.dataset.undo] = 'Could not reopen: ' + e.message; }
    await load();
  });
  root.querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => {
    const key = 'd:' + b.dataset.clear;
    b.disabled = true;
    try { await post(`/api/board/decisions/${encodeURIComponent(b.dataset.clear)}/clear`, {}); delete cardErr[key]; }
    catch (e) { cardErr[key] = 'Not saved: ' + e.message; }
    await load();
  });
}
</script>
</body>
</html>
