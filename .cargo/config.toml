[alias]
# Same cargo-xtask convention as CogniPilot/rumoca; no shell wrapper.
xtask = "run --locked --package xtask --bin xtask --"
# The name gate is its own binary so xtask stays dependency-free (see the xtask manifest policy).
namegate = "run --locked --package reverie-namegate --bin reverie-namegate --"
