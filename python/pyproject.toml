[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverie"
version = "0.1.0"
description = "Provider-independent agent identity, memory and reverie orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "bitsandbytes", "trl", "datasets", "accelerate"]

[project.scripts]
reverie-identity = "reverie.cli:main"
reverie-cycle-demo = "reverie.cycle_demo:main"
reverie-governance = "reverie.governance:main"
reverie-cycle = "reverie.cycle:main"
reverie-backend = "reverie.backend:main"
reverie-context = "reverie.context_cli:main"
reverie-runtime = "reverie.runtime:main"
reverie-workspaces = "reverie.workspaces:main"
reverie-memory = "reverie.memory_cli:main"
reverie-opencode = "reverie.opencode:main"
reverie-chat = "reverie.chat:main"
reverie-gpu-publisher = "reverie.gpu_publisher:main"
reverie-sleep = "reverie.sleep:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
reverie = ["plugins/*.mjs", "rules.md", "skills/*/SKILL.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reverie*", "experts*"]
namespaces = false
