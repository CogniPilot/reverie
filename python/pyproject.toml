[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverie"
version = "0.1.0"
description = "Provider-independent agent identity, memory and reverie orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "bitsandbytes", "trl", "datasets", "accelerate"]

[project.scripts]
reverie-cycle = "reverie.cycle:main"
reverie-runtime = "reverie.runtime:main"
reverie-chat = "reverie.chat:main"
reverie-worker-store-maintenance = "reverie.worker_store_maintenance:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
reverie = ["ops-core*.schema.json", "ops-classifier-pin.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reverie*", "experts*"]
namespaces = false
