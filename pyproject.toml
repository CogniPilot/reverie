[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverie-fleet"
version = "0.1.0"
description = "Provider-independent agent identity, memory and fleet orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "bitsandbytes", "trl", "datasets", "accelerate"]

[project.scripts]
reverie = "cto.cli:main"
fleet-cycle-demo = "cto.cycle_demo:main"
fleet-governance = "cto.governance:main"
fleet-cycle = "cto.cycle:main"
fleet-backend = "cto.backend:main"
fleet-context = "cto.context_cli:main"
fleet-runtime = "cto.runtime:main"
fleet-workspaces = "cto.workspaces:main"
fleet-memory = "cto.memory_cli:main"
fleet-opencode = "cto.opencode:main"
cto-chat = "cto.chat:main"
cto-opencode = "cto.opencode:main"
fleet-gpu-publisher = "cto.gpu_publisher:main"
fleet-sleep = "cto.sleep:main"

[tool.setuptools.package-data]
cto = ["plugins/*.mjs", "rules.md", "skills/*/SKILL.md", "resources/*.json"]

[tool.setuptools.packages.find]
include = ["cto*", "experts*"]
namespaces = false
